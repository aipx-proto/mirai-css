  <script type="module" id="injected-js">
    // Theme toggle: toggles .light on <html> when the theme button is clicked

    document.addEventListener("DOMContentLoaded", () => {
      const themeBtn = document.querySelector('button[title="Theme"]');
      if (themeBtn) {
        themeBtn.addEventListener("click", () => {
          document.documentElement.classList.toggle("light");
        });
      }

      // Sidebar collapse toggle
      const collapseBtn = document.querySelector('aside button[title="Collapse Sidebar"]');
      const sidebar = document.querySelector("aside");
      const tabLinks = sidebar?.querySelectorAll(".mri-tab");

      let collapsed = false;

      if (collapseBtn && sidebar && tabLinks) {
        collapseBtn.addEventListener("click", () => {
          collapsed = !collapsed;
          tabLinks.forEach((tab) => {
            if (collapsed) {
              tab.classList.add("mri-icon-only");
              // Hide text nodes (span/text after icon)
              tab.querySelectorAll("vibe-icon ~ *").forEach((el) => {
                el.style.display = "none";
              });
            } else {
              tab.classList.remove("mri-icon-only");
              tab.querySelectorAll("vibe-icon ~ *").forEach((el) => {
                el.style.display = "";
              });
            }
          });
        });
      }
    });
  </script>

Cinput type=\"email\" placeholder=\"Email\" \/>\n\u003Cinput type=\"password\" placeholder=\"Password\" \/>\n\u003Ctextarea placeholder=\"Message\">\u003C\/textarea>\n```\n\n### Form Controls\n\n```html\n\u003C!-- Checkbox (default) -->\n\u003Clabel>\u003Cinput type=\"checkbox\" \/> Remember me\u003C\/label>\n\n\u003C!-- Switch variant -->\n\u003Clabel>\u003Cinput type=\"checkbox\" class=\"mri-switch\" \/> Enable notifications\u003C\/label>\n\n\u003C!-- Radio buttons -->\n\u003Clabel>\u003Cinput type=\"radio\" name=\"option\" value=\"1\" \/> Option 1\u003C\/label>\n\u003Clabel>\u003Cinput type=\"radio\" name=\"option\" value=\"2\" \/> Option 2\u003C\/label>\n\n\u003C!-- Range slider -->\n\u003Cinput type=\"range\" min=\"0\" max=\"100\" value=\"50\" \/>\n```\n\n### Progress Indicators\n\n```html\n\u003C!-- Determinate progress bar -->\n\u003Cprogress value=\"33\" max=\"100\">\u003C\/progress>\n\n\u003C!-- Indeterminate progress bar (pulsing) -->\n\u003Cprogress indeterminate>\u003C\/progress>\n\n\u003C!-- Spinner (circular loading indicator) -->\n\u003Cprogress class=\"mri-spinner\" indeterminate>\u003C\/progress>\n```\n\n### Accordions\n\n```html\n\u003C!-- Accordion using native details\/summary -->\n\u003Cdetails>\n  \u003Csummary>Accordion Title\u003C\/summary>\n  \u003Cdiv class=\"p-4\">\n    \u003Cp>Accordion content goes here.\u003C\/p>\n  \u003C\/div>\n\u003C\/details>\n```\n\n### Tabs\n\n```html\n\u003C!-- Horizontal tabs -->\n\u003Cnav class=\"mri-tab-list\">\n  \u003Cbutton class=\"mri-tab mri-active\">Active Tab\u003C\/button>\n  \u003Cbutton class=\"mri-tab\">Tab 2\u003C\/button>\n  \u003Cbutton class=\"mri-tab\">Tab 3\u003C\/button>\n\u003C\/nav>\n\n\u003C!-- Vertical tabs -->\n\u003Cnav class=\"mri-tab-list mri-vertical\">\n  \u003Ca href=\"#section1\" class=\"mri-tab mri-active\">Section 1\u003C\/a>\n  \u003Ca href=\"#section2\" class=\"mri-tab\">Section 2\u003C\/a>\n  \u003Ca href=\"#section3\" class=\"mri-tab\">Section 3\u003C\/a>\n\u003C\/nav>\n```\n\n### Dialogs\n\n```html\n\u003C!-- Native dialog element -->\n\u003Cdialog>\n  \u003Cdiv class=\"p-6\">\n    \u003Ch2 class=\"text-xl font-semibold mb-4\">Dialog Title\u003C\/h2>\n    \u003Cp class=\"mb-4\">Dialog content goes here.\u003C\/p>\n    \u003Cdiv class=\"flex gap-2 justify-end\">\n      \u003Cbutton class=\"mri-appearance-transparent\">Cancel\u003C\/button>\n      \u003Cbutton class=\"mri-appearance-primary\">Confirm\u003C\/button>\n    \u003C\/div>\n  \u003C\/div>\n\u003C\/dialog>\n```\n\n## SIZING CLASSES\n\n```html\n\u003C!-- Small size -->\n\u003Cbutton class=\"mri-size-small\">Small\u003C\/button>\n\n\u003C!-- Default size -->\n\u003Cbutton>Default\u003C\/button>\n\n\u003C!-- Large size -->\n\u003Cbutton class=\"mri-size-large\">Large\u003C\/button>\n```\n\n## ICONS\n\nUse the vibe-icon web component \n\n## LAYOUT WITH TAILWIND\n\nCombine Mirai.css components with Tailwind layout utilities:\n\n```html\n\u003Cdiv class=\"bg-neutral-700 p-6 rounded-2xl max-w-sm flex flex-col gap-4\">\n  \u003Ch2 class=\"text-2xl font-semibold text-white\">Sign In\u003C\/h2>\n  \u003Cp class=\"text-neutral-400\">Sign in to your account\u003C\/p>\n  \u003Cdiv class=\"flex flex-col gap-1\">\n    \u003Clabel class=\"block text-sm font-medium text-neutral-200\">Email\u003C\/label>\n    \u003Cinput type=\"email\" placeholder=\"name@example.com\" \/>\n  \u003C\/div>\n  \u003Cdiv class=\"flex flex-col gap-1\">\n    \u003Clabel class=\"block text-sm font-medium text-neutral-200\">Password\u003C\/label>\n    \u003Cinput type=\"password\" placeholder=\"********\" \/>\n  \u003C\/div>\n  \u003Cdiv class=\"flex items-center gap-2\">\n    \u003Cinput type=\"checkbox\" id=\"remember\" \/>\n    \u003Clabel for=\"remember\" class=\"text-sm text-neutral-200\">Remember me\u003C\/label>\n  \u003C\/div>\n  \u003Cdiv class=\"flex gap-2\">\n    \u003Cbutton class=\"mri-appearance-primary flex-1\">Sign In\u003C\/button>\n    \u003Cbutton class=\"flex-1\">Sign Up\u003C\/button>\n  \u003C\/div>\n\u003C\/div>\n```\n\n---\n---\n\n# Vibe Icon - Microsoft Fluent Icons Web Component\n\n## Installation\n\nAdd this script tag to your HTML:\n\n```html\n\u003Cscript src=\"https:\/\/esm.sh\/vibe-icon@latest\" type=\"module\">\u003C\/script>\n```\n\n## Usage\n\nUse the `\u003Cvibe-icon>` component with these attributes:\n\n- `name` (required): Icon name from the list below\n- `filled` (optional): Shows filled variant when present\n- `size` (optional): Icon size (e.g., \"20\", \"24\")\n\n## Examples\n\n```html\n\u003Cvibe-icon name=\"home\">\u003C\/vibe-icon>\n\u003Cvibe-icon name=\"settings\" filled>\u003C\/vibe-icon>\n\u003Cvibe-icon name=\"search\" size=\"24\">\u003C\/vibe-icon>\n```\n\n## Icon Names (200 Most Common)\n\nFor icons beyond the 200 most common ones listed below, direct users to the [Vibe Icon Search App](https:\/\/aipx-proto.github.io\/vibe-icon\/) where they can browse and search the complete icon library.\n\nIcon names use lowercase with hyphens (e.g., \"arrow-down\", \"weather-sunny\")\n\n### Core Actions\n\nadd, subtract, delete, edit, save, search, share, print, settings, options, filter, lock-closed, lock-open, heart, star, info, question-circle, alert, sign-out, copy, cut, pen\n\n### Navigation\n\narrow-up, arrow-down, arrow-left, arrow-right, arrow-up-right, arrow-up-left, arrow-down-right, arrow-down-left, arrow-previous, arrow-next, arrow-expand, arrow-maximize, arrow-minimize, arrow-redo, arrow-undo, arrow-reply, arrow-reset, chevron-up, chevron-down, chevron-left, chevron-right, chevron-up-down, chevron-down-up, home, navigation, dismiss, more-horizontal, more-vertical\n\n_Hint: `dismiss` is \"x\" or close_\n\n### Media Controls\n\nplay, pause, stop, record, fast-forward, rewind, next, previous, speaker-2, speaker-1, speaker-mute, camera, image, video, music-note-1, mic, mic-off\n\n### Text Formatting\n\ntext-bold, text-italic, text-underline, text-strikethrough, text-align-left, text-align-center, text-align-right, text-align-justify,
